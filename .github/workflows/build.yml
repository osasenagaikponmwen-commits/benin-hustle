name: Build Benin Hustle APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Put the files in their proper folders
        run: |
          set -e
          P=app/src/main/java/com/nagi/hustle
          R=app/src/main/res
          mkdir -p "$P" "$R/values" "$R/mipmap-xxxhdpi" gradle/wrapper
          [ -f app-build.gradle.kts ] && mv app-build.gradle.kts app/build.gradle.kts
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
          for f in strings colors themes; do [ -f $f.xml ] && mv $f.xml "$R/values/"; done
          [ -f ic_launcher.png ] && mv ic_launcher.png "$R/mipmap-xxxhdpi/"
          for f in Data GameServer GameClient World Landmarks GameView MainActivity; do [ -f $f.kt ] && mv $f.kt "$P/"; done
          find . -path ./.git -prune -o -type f -print | sort

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Keep the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: Benin-Hustle-apk
          path: app/build/outputs/apk/debug/app-debug.apk
